<!DOCTYPE html>
<html>
<head>
    <title>DApp Shop - Admin Panel</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; max-width: 1200px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        .shop-title { text-align: center; margin-bottom: 30px; }
        
        /* MetaMask Button */
        .metamask-btn { background: #f6851b; color: white; padding: 12px 25px; border: none; cursor: pointer; font-size: 16px; border-radius: 8px; margin: 10px 0; }
        .wallet-info { background: #e8f5e9; padding: 10px; border-radius: 8px; margin: 10px 0; display: none; }
        
        /* Admin Panel - ẨN MẶC ĐỊNH */
        #admin-section { display: none; background: #fff3e0; padding: 20px; border-radius: 10px; margin-bottom: 30px; border: 2px solid #ff9800; }
        #admin-section h2 { margin-top: 0; color: #ff9800; }
        #admin-section input, #admin-section textarea { margin: 5px; padding: 8px; width: 200px; }
        #admin-section button { background: #ff9800; color: white; padding: 8px 15px; border: none; cursor: pointer; border-radius: 5px; }
        
        /* Products Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .product-card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .product-card h3 { margin: 0 0 10px 0; color: #333; }
        .product-price { font-size: 20px; color: #4CAF50; font-weight: bold; margin: 10px 0; }
        .buy-btn { background: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer; width: 100%; margin-top: 10px; border-radius: 5px; }
        
        /* Nút xóa - ẨN MẶC ĐỊNH, chỉ hiện khi Admin */
        .btn-delete { display: none; background: #f44336; color: white; padding: 5px 10px; border: none; cursor: pointer; margin-top: 10px; width: 100%; border-radius: 5px; }
        
        /* Cart */
        .cart { background: white; border-radius: 10px; padding: 20px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .cart-item { border-bottom: 1px solid #ddd; padding: 10px 0; display: flex; justify-content: space-between; }
        .cart-total { font-size: 18px; font-weight: bold; margin: 10px 0; text-align: right; }
        .checkout-btn { background: #ff9800; color: white; padding: 10px 20px; border: none; cursor: pointer; font-size: 16px; border-radius: 5px; }
        
        /* QR Code */
        #qr { margin: 20px 0; text-align: center; }
        #result { margin-top: 20px; padding: 10px; background: #e8f5e9; border-radius: 5px; }
        
        .admin-badge { background: #ff9800; color: white; padding: 2px 8px; border-radius: 20px; font-size: 12px; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="shop-title">
        <h1>🏪 DApp Shop - Thanh toán USDC</h1>
        <p>Kết nối MetaMask để mua hàng</p>
    </div>
    
    <!-- MetaMask Section -->
    <div style="text-align: center; margin: 20px 0;">
        <button id="connectMetaMask" class="metamask-btn">🦊 Kết nối MetaMask</button>
        <div id="walletInfo" class="wallet-info"></div>
    </div>
    
    <!-- Admin Panel - CHỈ HIỆN KHI KẾT NỐI VỚI VÍ ADMIN -->
    <div id="admin-section">
        <h2>👑 Admin Panel (Chỉ hiển thị với chủ shop)</h2>
        <input type="text" id="productName" placeholder="Tên sản phẩm">
        <input type="number" id="productPrice" placeholder="Giá (USDC)">
        <input type="text" id="productDesc" placeholder="Mô tả">
        <input type="number" id="productStock" placeholder="Số lượng">
        <button onclick="addProduct()">➕ Thêm sản phẩm</button>
    </div>
    
    <!-- Products Grid -->
    <div class="products-grid" id="products"></div>
    
    <!-- Shopping Cart -->
    <div class="cart" id="cart">
        <h2>🛒 Giỏ hàng</h2>
        <div id="cartItems"></div>
        <div id="cartTotal"></div>
        <button class="checkout-btn" onclick="checkout()">Thanh toán với MetaMask</button>
    </div>
    
    <div id="qr"></div>
    <div id="result"></div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        let cart = [];
        let products = [];
        let walletAddress = null;
        let ADMIN_WALLET = ""; // Sẽ lấy từ server
        
        // Lấy địa chỉ Admin từ server
        async function loadAdminWallet() {
            const res = await fetch('/api/admin-wallet');
            const data = await res.json();
            ADMIN_WALLET = data.adminWallet;
            console.log('Admin wallet:', ADMIN_WALLET);
        }
        
        // ========== META MASK & PHÂN QUYỀN ==========
        async function connectMetaMask() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    walletAddress = accounts[0].toLowerCase();
                    
                    const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                    
                    // Hiển thị thông tin ví
                    document.getElementById('walletInfo').style.display = 'block';
                    document.getElementById('walletInfo').innerHTML = `
                        ✅ Đã kết nối: ${walletAddress.substring(0, 6)}...${walletAddress.substring(38)}
                        ${walletAddress === ADMIN_WALLET ? '<span class="admin-badge">👑 ADMIN</span>' : '<span class="admin-badge">🛒 Khách hàng</span>'}
                        <br><small>Mạng: ${chainId === '0x13882' ? 'Polygon Amoy ✅' : 'Chưa đúng mạng'}</small>
                    `;
                    
                    // ========== KIỂM TRA QUYỀN ADMIN ==========
                    const adminSection = document.getElementById('admin-section');
                    const deleteButtons = document.querySelectorAll('.btn-delete');
                    
                    if (walletAddress === ADMIN_WALLET) {
                        // Nếu là Admin: Hiển thị vùng thêm sản phẩm và các nút xóa
                        adminSection.style.display = 'block';
                        deleteButtons.forEach(btn => btn.style.display = 'block');
                        console.log('👑 Admin mode: Hiển thị quản trị');
                    } else {
                        // Nếu là khách: Ẩn vùng admin và các nút xóa
                        adminSection.style.display = 'none';
                        deleteButtons.forEach(btn => btn.style.display = 'none');
                        console.log('🛒 Customer mode: Ẩn quản trị');
                    }
                    
                    document.getElementById('connectMetaMask').innerHTML = '🟢 Đã kết nối';
                    
                    // Lắng nghe sự kiện đổi ví
                    window.ethereum.on('accountsChanged', handleAccountsChanged);
                    window.ethereum.on('chainChanged', () => window.location.reload());
                    
                } catch (error) {
                    console.error('Lỗi:', error);
                    alert('Lỗi kết nối MetaMask: ' + error.message);
                }
            } else {
                alert('❌ Vui lòng cài đặt MetaMask!');
                window.open('https://metamask.io/download/', '_blank');
            }
        }
        
        // Xử lý khi đổi ví
        function handleAccountsChanged(accounts) {
            if (accounts.length > 0) {
                walletAddress = accounts[0].toLowerCase();
                const adminSection = document.getElementById('admin-section');
                const deleteButtons = document.querySelectorAll('.btn-delete');
                
                if (walletAddress === ADMIN_WALLET) {
                    adminSection.style.display = 'block';
                    deleteButtons.forEach(btn => btn.style.display = 'block');
                } else {
                    adminSection.style.display = 'none';
                    deleteButtons.forEach(btn => btn.style.display = 'none');
                }
                
                document.getElementById('walletInfo').innerHTML = `
                    ✅ Đã đổi ví: ${walletAddress.substring(0, 6)}...${walletAddress.substring(38)}
                    ${walletAddress === ADMIN_WALLET ? '<span class="admin-badge">👑 ADMIN</span>' : '<span class="admin-badge">🛒 Khách hàng</span>'}
                `;
            } else {
                walletAddress = null;
                document.getElementById('admin-section').style.display = 'none';
                document.getElementById('walletInfo').style.display = 'none';
            }
        }
        
        // Gắn sự kiện
        document.getElementById('connectMetaMask').addEventListener('click', connectMetaMask);
        
        // ========== TẢI SẢN PHẨM ==========
        async function loadProducts() {
            const res = await fetch('/api/products');
            const data = await res.json();
            products = data.products;
            renderProducts();
        }
        
        function renderProducts() {
            const container = document.getElementById('products');
            if (!products.length) {
                container.innerHTML = '<p>Chưa có sản phẩm nào</p>';
                return;
            }
            
            container.innerHTML = products.map(product => `
                <div class="product-card" data-id="${product.id}">
                    <h3>${product.name}</h3>
                    <div class="product-price">${product.price} USDC</div>
                    <div class="product-desc">${product.description || 'Không có mô tả'}</div>
                    <button class="buy-btn" onclick="addToCart(${product.id})">➕ Thêm vào giỏ</button>
                    <button class="btn-delete" onclick="deleteProduct(${product.id})">🗑️ Xóa sản phẩm</button>
                </div>
            `).join('');
            
            // Cập nhật lại trạng thái ẩn/hiện nút xóa dựa trên quyền hiện tại
            if (walletAddress === ADMIN_WALLET) {
                document.querySelectorAll('.btn-delete').forEach(btn => btn.style.display = 'block');
            } else {
                document.querySelectorAll('.btn-delete').forEach(btn => btn.style.display = 'none');
            }
        }
        
        // ========== GIỎ HÀNG ==========
        function addToCart(productId) {
            if (!walletAddress) {
                alert('⚠️ Vui lòng kết nối MetaMask trước khi mua hàng!');
                return;
            }
            
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            renderCart();
        }
        
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            renderCart();
        }
        
        function updateQuantity(productId, delta) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                }
            }
            renderCart();
        }
        
        function renderCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            const cartTotalDiv = document.getElementById('cartTotal');
            
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p>Giỏ hàng trống</p>';
                cartTotalDiv.innerHTML = '';
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            cartItemsDiv.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div><strong>${item.name}</strong> - ${item.price} USDC x ${item.quantity}</div>
                    <div>
                        <button onclick="updateQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, 1)">+</button>
                        <button onclick="removeFromCart(${item.id})">❌</button>
                    </div>
                </div>
            `).join('');
            
            cartTotalDiv.innerHTML = `<div class="cart-total">Tổng cộng: ${total} USDC</div>`;
        }
        
        // ========== THANH TOÁN ==========
        async function checkout() {
            if (!walletAddress) {
                alert('⚠️ Vui lòng kết nối MetaMask trước khi thanh toán!');
                return;
            }
            
            if (cart.length === 0) {
                alert('Giỏ hàng trống!');
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shopAddress = '0xbe4097719d897ea4c533151fe4f5d012041f6e93';
            
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                
                // Gửi POL (MATIC) thay vì USDC cho đơn giản
                const tx = await signer.sendTransaction({
                    to: shopAddress,
                    value: ethers.utils.parseEther(total.toString())
                });
                
                document.getElementById('result').innerHTML = `
                    <div style="background: #fff3e0; padding: 15px; border-radius: 5px;">
                        ⏳ <strong>Đang xử lý...</strong><br>
                        Hash: ${tx.hash.substring(0, 30)}...
                    </div>
                `;
                
                const receipt = await tx.wait();
                
                if (receipt.status === 1) {
                    document.getElementById('result').innerHTML = `
                        <div style="background: #d4edda; padding: 15px; border-radius: 5px;">
                            ✅ <strong>THANH TOÁN THÀNH CÔNG!</strong><br>
                            💰 Số tiền: ${total} POL<br>
                            🆔 Hash: <a href="https://amoy.polygonscan.com/tx/${tx.hash}" target="_blank">${tx.hash.substring(0, 30)}...</a>
                        </div>
                    `;
                    cart = [];
                    renderCart();
                }
            } catch (error) {
                console.error(error);
                alert('Lỗi: ' + error.message);
            }
        }
        
        // ========== ADMIN ==========
        async function addProduct() {
            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            const description = document.getElementById('productDesc').value;
            const stock = document.getElementById('productStock').value;
            
            if (!name || !price) {
                alert('Vui lòng nhập tên và giá');
                return;
            }
            
            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, price: parseFloat(price), description, stock: parseInt(stock) })
            });
            const data = await res.json();
            
            if (data.success) {
                alert('✅ Thêm sản phẩm thành công!');
                document.getElementById('productName').value = '';
                document.getElementById('productPrice').value = '';
                document.getElementById('productDesc').value = '';
                document.getElementById('productStock').value = '';
                loadProducts();
            }
        }
        
        async function deleteProduct(productId) {
            if (!confirm('Xóa sản phẩm này?')) return;
            const res = await fetch(`/api/products/${productId}`, { method: 'DELETE' });
            const data = await res.json();
            if (data.success) {
                alert('Đã xóa');
                loadProducts();
            }
        }
        
        // Khởi tạo
        loadAdminWallet();
        loadProducts();
        renderCart();
    </script>
</body>
</html>
