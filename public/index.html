<!DOCTYPE html>
<html>
<head>
    <title>DApp Shop - MetaMask Payment</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; max-width: 1200px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        .shop-title { text-align: center; margin-bottom: 30px; }
        
        /* MetaMask Button */
        .metamask-btn { background: #f6851b; color: white; padding: 12px 25px; border: none; cursor: pointer; font-size: 16px; border-radius: 8px; margin: 10px 0; }
        .metamask-btn:hover { background: #e2761b; }
        .wallet-info { background: #e8f5e9; padding: 10px; border-radius: 8px; margin: 10px 0; display: none; }
        
        /* Admin Panel */
        .admin-panel { background: white; padding: 20px; border-radius: 10px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .admin-panel h2 { margin-top: 0; color: #666; font-size: 18px; }
        .admin-panel input, .admin-panel textarea { margin: 5px; padding: 8px; width: 200px; }
        .admin-panel button { background: #2196F3; color: white; padding: 8px 15px; border: none; cursor: pointer; }
        
        /* Products Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .product-card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-card h3 { margin: 0 0 10px 0; color: #333; }
        .product-price { font-size: 20px; color: #4CAF50; font-weight: bold; margin: 10px 0; }
        .product-desc { color: #666; font-size: 14px; margin: 10px 0; }
        .buy-btn { background: #4CAF50; color: white; padding: 10px 20px; border: none; cursor: pointer; width: 100%; margin-top: 10px; border-radius: 5px; }
        .delete-btn { background: #f44336; color: white; padding: 5px 10px; border: none; cursor: pointer; margin-top: 10px; width: 100%; border-radius: 5px; }
        
        /* Cart */
        .cart { background: white; border-radius: 10px; padding: 20px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .cart-item { border-bottom: 1px solid #ddd; padding: 10px 0; display: flex; justify-content: space-between; }
        .cart-total { font-size: 18px; font-weight: bold; margin: 10px 0; text-align: right; }
        .checkout-btn { background: #ff9800; color: white; padding: 10px 20px; border: none; cursor: pointer; font-size: 16px; border-radius: 5px; }
        
        /* QR Code */
        #qr { margin: 20px 0; text-align: center; }
        #qr img { max-width: 200px; }
        #result { margin-top: 20px; padding: 10px; background: #e8f5e9; border-radius: 5px; }
        
        button:hover { opacity: 0.9; }
        .loading { opacity: 0.6; pointer-events: none; }
    </style>
</head>
<body>
    <div class="shop-title">
        <h1>🏪 DApp Shop - Thanh toán USDC</h1>
        <p>Kết nối MetaMask để thanh toán bằng USDC trên Polygon Amoy</p>
    </div>
    
    <!-- MetaMask Section -->
    <div style="text-align: center; margin: 20px 0;">
        <button id="connectMetaMask" class="metamask-btn">🦊 Kết nối MetaMask</button>
        <div id="walletInfo" class="wallet-info"></div>
    </div>
    
    <!-- Admin Panel -->
    <div class="admin-panel">
        <h2>➕ Admin: Thêm sản phẩm mới</h2>
        <input type="text" id="productName" placeholder="Tên sản phẩm">
        <input type="number" id="productPrice" placeholder="Giá (USDC)">
        <input type="text" id="productDesc" placeholder="Mô tả">
        <input type="number" id="productStock" placeholder="Số lượng">
        <button onclick="addProduct()">Thêm sản phẩm</button>
    </div>
    
    <!-- Products Grid -->
    <div class="products-grid" id="products"></div>
    
    <!-- Shopping Cart -->
    <div class="cart" id="cart">
        <h2>🛒 Giỏ hàng</h2>
        <div id="cartItems"></div>
        <div id="cartTotal"></div>
        <button class="checkout-btn" onclick="checkout()">Thanh toán với MetaMask</button>
    </div>
    
    <!-- QR Code & Result -->
    <div id="qr"></div>
    <div id="result"></div>

    <script>
        let cart = [];
        let products = [];
        let walletAddress = null;
        let provider = null;
        
        // ========== META MASK ==========
        async function connectMetaMask() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    // Yêu cầu kết nối
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    walletAddress = accounts[0];
                    
                    // Lấy chain ID
                    const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                    
                    // Kiểm tra có đang dùng mạng Polygon Amoy không
                    if (chainId !== '0x13882') { // 80002 in hex = 0x13882
                        alert('⚠️ Vui lòng chuyển sang mạng Polygon Amoy (Chain ID: 80002)');
                    }
                    
                    // Hiển thị thông tin ví
                    document.getElementById('walletInfo').style.display = 'block';
                    document.getElementById('walletInfo').innerHTML = `
                        ✅ Đã kết nối: ${walletAddress.substring(0, 6)}...${walletAddress.substring(38)}<br>
                        <small>Mạng: ${chainId === '0x13882' ? 'Polygon Amoy ✅' : 'Chưa đúng mạng'}</small>
                    `;
                    
                    document.getElementById('connectMetaMask').innerHTML = '🟢 Đã kết nối';
                    
                    // Lắng nghe sự kiện đổi mạng
                    window.ethereum.on('chainChanged', () => window.location.reload());
                    window.ethereum.on('accountsChanged', () => window.location.reload());
                    
                } catch (error) {
                    console.error('Lỗi kết nối MetaMask:', error);
                    alert('Lỗi kết nối MetaMask: ' + error.message);
                }
            } else {
                alert('❌ Vui lòng cài đặt MetaMask!');
                window.open('https://metamask.io/download/', '_blank');
            }
        }
        
        // Gắn sự kiện cho nút MetaMask
        document.getElementById('connectMetaMask').addEventListener('click', connectMetaMask);
        
        // ========== TẢI SẢN PHẨM ==========
        async function loadProducts() {
            const res = await fetch('/api/products');
            const data = await res.json();
            products = data.products;
            renderProducts();
        }
        
        function renderProducts() {
            const container = document.getElementById('products');
            if (!products.length) {
                container.innerHTML = '<p>Chưa có sản phẩm nào</p>';
                return;
            }
            
            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <h3>${product.name}</h3>
                    <div class="product-price">${product.price} USDC</div>
                    <div class="product-desc">${product.description || 'Không có mô tả'}</div>
                    <button class="buy-btn" onclick="addToCart(${product.id})">➕ Thêm vào giỏ</button>
                    <button class="delete-btn" onclick="deleteProduct(${product.id})">🗑️ Xóa</button>
                </div>
            `).join('');
        }
        
        // ========== GIỎ HÀNG ==========
        function addToCart(productId) {
            if (!walletAddress) {
                alert('⚠️ Vui lòng kết nối MetaMask trước khi mua hàng!');
                return;
            }
            
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            renderCart();
        }
        
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            renderCart();
        }
        
        function updateQuantity(productId, delta) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                }
            }
            renderCart();
        }
        
        function renderCart() {
            const cartItemsDiv = document.getElementById('cartItems');
            const cartTotalDiv = document.getElementById('cartTotal');
            
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p>Giỏ hàng trống</p>';
                cartTotalDiv.innerHTML = '';
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            cartItemsDiv.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div><strong>${item.name}</strong> - ${item.price} USDC x ${item.quantity}</div>
                    <div>
                        <button onclick="updateQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, 1)">+</button>
                        <button onclick="removeFromCart(${item.id})">❌</button>
                    </div>
                </div>
            `).join('');
            
            cartTotalDiv.innerHTML = `<div class="cart-total">Tổng cộng: ${total} USDC</div>`;
        }
        
        // ========== THANH TOÁN ==========
        async function checkout() {
            if (!walletAddress) {
                alert('⚠️ Vui lòng kết nối MetaMask trước khi thanh toán!');
                return;
            }
            
            if (cart.length === 0) {
                alert('Giỏ hàng trống!');
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            // Tạo transaction trên blockchain qua MetaMask
            try {
                const orderId = Date.now();
                const shopAddress = '0xbe4097719d897ea4c533151fe4f5d012041f6e93'; // Địa chỉ ví shop từ createWalletSDK.js
                
                // USDC contract trên Polygon Amoy
                const usdcAddress = '0x9999999999999999999999999999999999999999'; // Thay bằng địa chỉ USDC testnet thật
                
                // ABI chuyển USDC (chỉ cần function transfer)
                const abi = [
                    'function transfer(address to, uint256 amount) public returns (bool)'
                ];
                
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                const usdcContract = new ethers.Contract(usdcAddress, abi, signer);
                
                // Số USDC (6 decimals trên Polygon)
                const amountWithDecimals = ethers.utils.parseUnits(total.toString(), 6);
                
                // Gửi giao dịch
                const tx = await usdcContract.transfer(shopAddress, amountWithDecimals);
                
                document.getElementById('result').innerHTML = `
                    <div style="background: #fff3e0; padding: 15px; border-radius: 5px;">
                        ⏳ <strong>Đang xử lý giao dịch...</strong><br>
                        Hash: ${tx.hash.substring(0, 20)}...<br>
                        <small>Vui lòng chờ xác nhận từ blockchain</small>
                    </div>
                `;
                
                // Đợi xác nhận
                const receipt = await tx.wait();
                
                if (receipt.status === 1) {
                    document.getElementById('result').innerHTML = `
                        <div style="background: #d4edda; padding: 15px; border-radius: 5px;">
                            ✅ <strong>THANH TOÁN THÀNH CÔNG!</strong><br>
                            💰 Số tiền: ${total} USDC<br>
                            🆔 Transaction Hash: <a href="https://amoy.polygonscan.com/tx/${tx.hash}" target="_blank">${tx.hash.substring(0, 30)}...</a>
                        </div>
                    `;
                    
                    // Xóa giỏ hàng
                    cart = [];
                    renderCart();
                    document.getElementById('qr').innerHTML = '';
                } else {
                    alert('Giao dịch thất bại!');
                }
                
            } catch (error) {
                console.error('Lỗi thanh toán:', error);
                alert('Lỗi: ' + error.message);
            }
        }
        
        // ========== ADMIN ==========
        async function addProduct() {
            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            const description = document.getElementById('productDesc').value;
            const stock = document.getElementById('productStock').value;
            
            if (!name || !price) {
                alert('Vui lòng nhập tên và giá sản phẩm');
                return;
            }
            
            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, price: parseFloat(price), description, stock: parseInt(stock) })
            });
            const data = await res.json();
            
            if (data.success) {
                alert('✅ Thêm sản phẩm thành công!');
                document.getElementById('productName').value = '';
                document.getElementById('productPrice').value = '';
                document.getElementById('productDesc').value = '';
                document.getElementById('productStock').value = '';
                loadProducts();
            } else {
                alert('Lỗi: ' + data.error);
            }
        }
        
        async function deleteProduct(productId) {
            if (!confirm('Bạn có chắc muốn xóa sản phẩm này?')) return;
            
            const res = await fetch(`/api/products/${productId}`, { method: 'DELETE' });
            const data = await res.json();
            
            if (data.success) {
                alert('🗑️ Đã xóa sản phẩm');
                loadProducts();
            } else {
                alert('Lỗi: ' + data.error);
            }
        }
        
        // Khởi tạo
        loadProducts();
        renderCart();
        
        // Kiểm tra nếu đã cài MetaMask
        if (typeof window.ethereum === 'undefined') {
            document.getElementById('walletInfo').innerHTML = '⚠️ Chưa cài MetaMask. <a href="https://metamask.io/download/" target="_blank">Tải tại đây</a>';
            document.getElementById('walletInfo').style.display = 'block';
        }
    </script>
    
    <!-- Thêm ethers.js để tương tác với blockchain -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</body>
</html>
